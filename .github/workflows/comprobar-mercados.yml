name: Comprobar mercados de Bitvavo

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: academia
  cancel-in-progress: false

jobs:
  mercados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Consultar Bitvavo
        run: |
          mkdir -p diag
          python3 - <<'PY'
          import json, urllib.request
          def get(u):
              return json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "academia"}), timeout=30).read())
          ms = get("https://api.bitvavo.com/v2/markets")
          out = []
          for m in ms:
              if m["market"].endswith("-EUR") and m["base"] in ("BTC", "ETH", "SOL", "PAXG", "XAUT", "XRP", "ADA"):
                  c = get(f"https://api.bitvavo.com/v2/{m['market']}/candles?interval=1d&limit=1440")
                  first = min(int(x[0]) for x in c) if c else None
                  import datetime as dt
                  out.append(f"{m['market']}: estado={m['status']}, velas diarias desde {dt.datetime.utcfromtimestamp(first/1000).date() if first else '-'} (máx. 1440 por consulta)")
          gold = [m["market"] for m in ms if any(k in m["base"] for k in ("PAXG", "XAU", "GOLD", "GLD"))]
          out.append("Mercados de oro: " + (", ".join(gold) or "ninguno"))
          out.append(f"Total mercados EUR: {sum(m['market'].endswith('-EUR') for m in ms)}")
          # pares USDC (comisión 0,05 %): ¿se pueden operar por API y tienen liquidez suficiente?
          names = {m["market"]: m for m in ms}
          for base in ("BTC", "ETH", "SOL", "XRP", "USDC"):
              for q in ("EUR", "USDC"):
                  mk = f"{base}-{q}"
                  if mk not in names or mk == "USDC-USDC":
                      if q == "USDC" and base != "USDC":
                          out.append(f"{mk}: no aparece en la API")
                      continue
                  try:
                      t = get(f"https://api.bitvavo.com/v2/ticker/24h?market={mk}")
                      b = get(f"https://api.bitvavo.com/v2/ticker/book?market={mk}")
                      bid, ask = float(b.get("bid") or 0), float(b.get("ask") or 0)
                      spread = (ask - bid) / ask * 100 if ask else float("nan")
                      out.append(f"{mk}: estado={names[mk]['status']}, órdenes={','.join(names[mk].get('orderTypes', []))}, "
                                 f"volumen 24h={float(t.get('volumeQuote') or 0):,.0f} {q}, diferencial={spread:.3f} %")
                  except Exception as ex:  # noqa: BLE001
                      out.append(f"{mk}: error consultando ({ex})")
          open("diag/mercados_bitvavo.txt", "w").write("\n".join(out) + "\n")
          print("\n".join(out))
          PY
      - name: Guardar
        run: |
          git config user.name "academia-bot"
          git config user.email "academia-bot@users.noreply.github.com"
          git add diag/mercados_bitvavo.txt
          git diff --cached --quiet || git commit -m "Mercados de Bitvavo"
          git pull --rebase -X theirs origin main
          git push
