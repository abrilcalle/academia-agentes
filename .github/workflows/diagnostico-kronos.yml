name: Diagnóstico de Kronos

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: academia
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-kronos.txt
          git clone --depth 1 https://github.com/shiyu-coder/Kronos.git vendor/Kronos
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kronos-modelos-v1
      - name: Diagnóstico
        run: python scripts/diag_kronos.py
      - name: Guardar resultados
        if: always()
        run: |
          git config user.name "academia-bot"
          git config user.email "academia-bot@users.noreply.github.com"
          git add diag || true
          git diff --cached --quiet || git commit -m "Diagnóstico de Kronos"
          git pull --rebase -q origin main && git push
