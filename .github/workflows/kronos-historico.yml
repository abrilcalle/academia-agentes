name: Rellenar histórico de Kronos

# Ejecútalo a mano (pestaña Actions -> este flujo -> Run workflow) hasta que el panel
# deje de mostrar a Hugo "esperando datos". Cada tanda calcula unas 5 horas de previsiones.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: academia
  cancel-in-progress: false

jobs:
  historico:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-kronos.txt
          git clone --depth 1 https://github.com/shiyu-coder/Kronos.git vendor/Kronos

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kronos-modelos-v1

      - name: Calcular previsiones atrasadas
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python run_daily.py --kronos-tiempo 18000 --kronos-max 20000 --sin-fabrica

      - name: Guardar resultados
        run: |
          git config user.name "academia-bot"
          git config user.email "academia-bot@users.noreply.github.com"
          git add state data docs
          git diff --cached --quiet || git commit -m "Kronos: histórico $(date -u +%F)"
          git push
